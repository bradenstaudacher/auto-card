<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auto Card — Content Board</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f28; --panel-2: #232734; --border: #2e3342;
    --text: #e8eaf0; --muted: #9aa0b0; --accent: #7fb2e6;
    --common: #8b909e; --uncommon: #4fb56b; --rare: #d9a441;
    --proposed: #7fb2e6; --edits: #d9a441; --accepted: #4fb56b; --rejected: #d67f7f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a1d26, #14161c); position: sticky; top: 0; z-index: 20; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: 0.4px; }
  header .meta { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: 7px 13px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:hover { border-color: #4a5064; filter: brightness(1.12); }
  button.primary { background: var(--accent); color: #0d1a2b; border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; }
  button.danger { color: var(--rejected); }
  a.link { color: var(--accent); font-size: 12px; text-decoration: none; }

  .board { display: flex; gap: 12px; padding: 16px 22px 40px; align-items: flex-start;
    overflow-x: auto; min-height: 60vh; }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 300px; flex: none; display: flex; flex-direction: column; max-height: 82vh; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 11px 13px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-head .count { color: var(--muted); font-weight: 400; }
  .col.proposed .dot { background: var(--proposed); }
  .col.edits_needed .dot { background: var(--edits); }
  .col.accepted .dot { background: var(--accepted); }
  .col.rejected .dot { background: var(--rejected); }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; flex: 1; }
  .col-body.drop-hover { background: #232a38; outline: 2px dashed var(--accent); outline-offset: -6px; border-radius: 8px; }
  .col.reference { width: 280px; opacity: 0.92; }
  .col.reference .col-head .dot { background: var(--muted); }

  .tcard { background: var(--panel-2); border: 1px solid var(--border); border-left-width: 4px;
    border-radius: 8px; padding: 9px 11px; cursor: grab; }
  .tcard:active { cursor: grabbing; }
  .tcard.dragging { opacity: 0.4; }
  .tcard .row1 { display: flex; align-items: center; gap: 8px; }
  .glyph { width: 24px; height: 24px; border-radius: 6px; flex: none; display: grid;
    place-items: center; font-size: 13px; font-weight: 700; }
  .tcard .name { font-weight: 600; font-size: 13px; line-height: 1.2; flex: 1; }
  .tcard .desc { color: #cfd3de; font-size: 12px; margin-top: 6px; }
  .tcard .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); }
  .tag.rarity-uncommon { color: var(--uncommon); } .tag.rarity-rare { color: var(--rare); }
  .tcard .notes { font-size: 11px; color: var(--edits); margin-top: 6px; font-style: italic; }
  .tcard.promoted { border-left-color: var(--accepted); }
  .badge-promoted { font-size: 10px; color: var(--accepted); margin-left: auto; }

  /* Modal editor */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
    place-items: center; z-index: 50; padding: 20px; }
  .overlay.open { display: grid; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; font: inherit;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  .field textarea { resize: vertical; min-height: 58px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .field.err textarea, .field.err input { border-color: var(--rejected); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .rules-hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--rejected); color: var(--rejected); }
</style>
</head>
<body>
<header>
  <h1>🗂 Auto Card — Content Board</h1>
  <span class="meta" id="meta"></span>
  <div class="spacer"></div>
  <a class="link" href="/content.html" target="_blank">↗ view live content</a>
  <label class="meta" style="display:flex;align-items:center;gap:5px;">
    <input type="checkbox" id="showRef" checked /> show live reference
  </label>
  <button id="addBtn">+ Add card</button>
  <button id="refreshBtn" class="ghost">⟳</button>
  <button id="promoteBtn" class="primary">Promote accepted → core</button>
</header>

<div class="board" id="board"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/board.js"></script>
</body>
</html>
