# Monster templates for PvE encounters. Types span the circle so players must
# weigh their fielded champions against enemy weaknesses (per locked design).
# tier: weak | tough | elite | boss — used by the encounter builder to scale.
monsters:
  - key: lesser_imp
    name: Lesser Imp
    type: Occult
    color: purple
    role: weak melee
    tier: weak
    base_stats:
      health: 45
      attack_damage: 7
      magic_power: 2
      armor: 1
      shield: 2
      mana_cap: 4
      mana_regen: 0.5
      movement_speed: 3
      attack_range: 1
      attack_speed: 1.0

  - key: ash_hound
    name: Ash Hound
    type: Fury
    color: crimson
    role: fast melee
    tier: weak
    combat_effects:
      burn: { chance: 0.35, damage: 3, duration: 2 }
