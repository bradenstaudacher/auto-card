# Single-player 10-round curve (locked this session). player_slots = champions
# the player may deploy that round. Enemies come from EITHER an explicit
# `monsters:` list of keys (from monsters.yml) OR a `draw:` composition that
# samples that many monsters from each tier pool (base|medium|strong|boss),
# deterministically from the game seed. EncounterBuilder auto-places them in the
# right-side zone. stat_scale multiplies monster base stats (health/attack) for
# late-game ramp. reward choices: 3 on win / 2 on loss (0 on the boss round).
single_player:
  - round: 1
    player_slots: 1
    draw: { base: 2 }
    stat_scale: 1.0
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 2
    player_slots: 1
    draw: { medium: 1 }
    stat_scale: 1.0
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 3
    player_slots: 2
    draw: { base: 3 }
    stat_scale: 1.0
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 4
    player_slots: 2
    draw: { base: 2, medium: 1 }
    stat_scale: 1.05
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 5
    player_slots: 2
    draw: { base: 2, strong: 1 }
    stat_scale: 1.05
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 6
    player_slots: 3
    draw: { base: 4, medium: 1 }
    stat_scale: 1.15
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 7
    player_slots: 3
    draw: { base: 1, medium: 2 }
    stat_scale: 1.1
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 8
    player_slots: 3
    draw: { base: 1, medium: 2, strong: 1 }
    stat_scale: 1.2
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 9
    player_slots: 3
    draw: { base: 2, medium: 1, strong: 1 }
    stat_scale: 1.2
    reward_choices_on_win: 3
    reward_choices_on_loss: 2
  - round: 10
    player_slots: 3
    monsters: [the_maw, dread_knight, pale_acolyte]
    stat_scale: 1.5
    boss: true
    reward_choices_on_win: 0
    reward_choices_on_loss: 0

# Reward rarity weights (rare chance rises in later rounds via RewardRoller).
reward_rarity_weights:
  common: 70
  uncommon: 25
  rare: 5

# Co-op: fixed 2 champions per player each round (per locked design).
coop:
  deployed_per_player: 2
