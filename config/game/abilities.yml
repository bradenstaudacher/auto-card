# Ability metadata (display + validation). Effect LOGIC lives in
# app/lib/combat/abilities/*.rb keyed by name. Milestone 1 implements the first
# two; the rest are declared so content/UI can reference them as they land.
abilities:
  - name: Vampiric Drain
    type: Death
    category: ability
    damage_type: magic
    mana_cost: 3
    targeting: enemy
    range: 3
    implemented: true
    description: >-
      Drains an enemy for 25% of its current health, healing the caster for the
      damage dealt (after resist/type advantage), clamped to 5-40.

  - name: Cleave
    type: Fury
    category: ability
    damage_type: physical
    mana_cost: 4
    targeting: enemy
    range: 1
    implemented: true
    description: >-
      Strikes the target and all enemies adjacent to it for 150% attack damage.

  - name: Bone Spear
    type: Death
    category: ability
    damage_type: magic
    mana_cost: 4
    targeting: enemy
    range: 4
    implemented: false
    description: Placeholder — declared for content/UI; logic lands post-M1.

  - name: Shield Pulse
    type: Law
    category: ability
    damage_type: heal
    mana_cost: 5
    targeting: ally
    range: 3
    implemented: true
    description: Heal the most-wounded nearby ally for 150% magic power.

  - name: Hex Bolt
    type: Occult
    category: ability
    damage_type: magic
    mana_cost: 3
    targeting: enemy
    range: 4
    implemented: true
    description: Blast the nearest enemy for 160% magic power (ranged).

  - name: Holy Flare
    type: Holy
    category: ability
    damage_type: magic
    mana_cost: 4
    targeting: enemy
    range: 3
    implemented: true
    description: Sear an enemy for 150% magic power — devastating against Occult.

  - name: Dawnbreak
    type: Holy
    category: ability
    damage_type: magic
    mana_cost: 5
    targeting: enemy
    range: 3
    implemented: true
    description: >-
      Sears the target and enemies adjacent to it for 130% magic power, then
      wards allies adjacent to the caster with +50% magic power as shield.

  - name: Soul Crush
    type: Death
    category: ability
    damage_type: "true"
    mana_cost: 3
    targeting: enemy
    range: 3
    implemented: true
    description: >-
      Deals true damage equal to 40% of the caster's magic power, ignoring
      armor, resist, absorb shields, and type advantage. An anti-tank answer.

  - name: Jail
    type: Law
    category: ability
    damage_type: none
    mana_cost: 4
    targeting: enemy
    range: 3
    implemented: true
    description: >-
      Locks an enemy down so it cannot basic-attack for a short duration (it can
      still cast and move). Duration scales with card tier (1s / 1.5s / 2s).

  - name: Ward
    type: null
    category: ability
    damage_type: shield
    mana_cost: 4
    targeting: self
    range: 0
    implemented: true
    description: >-
      Grants an absorb-shield barrier (extra HP that soaks damage before health,
      shown grey on the health bar) to the caster and every adjacent ally.
      Class-agnostic protection.

  - name: Blitz
    type: null
    category: ability
    damage_type: buff
    mana_cost: 3
    targeting: self
    range: 0
    implemented: true
    description: >-
      Self-buff: raises the caster's attack speed for a few seconds. Refreshes
      rather than stacks on recast. Class-agnostic.

  - name: Sustain
    type: null
    category: ability
    damage_type: buff
    mana_cost: 3
    targeting: self
    range: 0
    implemented: true
    description: >-
      Self-buff: raises the caster's health regen for a few seconds. Refreshes
      rather than stacks on recast. Class-agnostic.

  - name: Fury Strike
    type: Fury
    category: ability
    damage_type: physical
    mana_cost: 3
    targeting: enemy
    range: 1
    implemented: false
    description: Placeholder.

  - name: Law Bind
    type: Law
    category: ability
    damage_type: none
    mana_cost: 4
    targeting: enemy
    range: 3
    implemented: false
    description: Placeholder — roots an enemy.

  - name: Alchemical Burst
    type: Occult
    category: ability
    damage_type: magic
    mana_cost: 5
    targeting: area
    range: 3
    implemented: false
    description: Placeholder — AoE.

  - name: Reaper Dash
    type: Death
    category: ability
    damage_type: physical
    mana_cost: 3
    targeting: enemy
    range: 3
    implemented: false
    description: Placeholder — gap closer.
