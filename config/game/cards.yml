# Starter card templates for the reward system. Balance is PROVISIONAL — names
# and numbers to be confirmed in the Content pass. `rules` carries the machine
# data: stat_modifiers (added to a character's stats), combat_effects, and
# ability_name (links an ability card to a Combat::Abilities definition).
