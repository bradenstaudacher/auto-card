    valid_types: []
    valid_subclasses: []
    rules:
      stat_modifiers: { shield: 4 }

  # --- Passives ---
  - key: card_battle_rhythm
    name: Battle Rhythm
    category: passive
    type_affinity: null
    rarity: common
    slot_type: passive
    description: "+1 mana regen."
    valid_types: []
    valid_subclasses: []
    rules:
      stat_modifiers: { mana_regen: 1 }

  - key: card_lawful_formation
    name: Lawful Formation
    category: passive
    type_affinity: Law
    rarity: uncommon
    slot_type: passive
    description: "+2 armor if adjacent to an ally at battle start."
    valid_types: []
    valid_subclasses: []
    rules:
      combat_effects: { adjacent_ally_armor: 2 }

  # --- Modifiers (run/roster level) ---
  - key: card_crimson_momentum
    name: Crimson Momentum
    category: modifier
    type_affinity: Fury
    rarity: rare
    slot_type: roster_modifier
    description: "Fury units gain +1 mana whenever they defeat an enemy."
    valid_types: [Fury]
    valid_subclasses: []
    rules:
      combat_effects: { on_kill_mana: 1, applies_to_type: Fury }
