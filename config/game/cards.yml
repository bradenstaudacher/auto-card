    name: Vampiric Drain
    category: ability
    type_affinity: Death
    rarity: common
    slot_type: ability
    tier: 1
    upgrades_to: card_vampiric_drain_2
    description: Drain 25% of an enemy's current health (5-40), healing yourself for it.
